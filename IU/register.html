<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Tienda de Ropa</title>
  <link rel="icon" type="image/png" href="img/APOLO_2 (1).png">
  <link rel="stylesheet" href="style/styles.css">  <link rel=\"stylesheet\" href=\"sidebar-styles.css\"></head>
<body>
  <div class="auth-container">
    <div class="auth-wrapper">
      <div class="auth-side">
        <div class="image-panel">
          <img src="img/ropa_exibida.jpg" alt="Exhibición de ropa" class="auth-image" />
        </div>
      </div>

      <div class="form-container">
        <div class="form-header">
          <div>
            <button type="button" class="btn btn-secondary back-button" onclick="window.location.href='index.html'">← Regresar</button>
            <div class="form-intro">
              <h2>Crear Cuenta</h2>
              <p>Rellena el formulario para comenzar</p>
            </div>
          </div>
          <button id="themeToggle" class="btn btn-outline theme-toggle" type="button">Modo oscuro</button>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label for="fullname">Nombre Completo</label>
            <input 
              type="text" 
              id="fullname" 
              name="fullname"
              placeholder="Juan Pérez" 
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              placeholder="tu@correo.com" 
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Teléfono</label>
            <input 
              type="tel" 
              id="phone" 
              name="phone"
              placeholder="+56 9 1234 5678" 
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password"
              placeholder="••••••••" 
              autocomplete="new-password"
              required
              minlength="6"
            />
            <small style="color: var(--text-secondary); font-size: 0.85rem; display: block; margin-top: 0.3rem;">Mínimo 6 caracteres</small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirmar Contraseña</label>
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword"
              placeholder="••••••••" 
              autocomplete="new-password"
              required
            />
          </div>

          <label class="checkbox-wrap" style="margin-bottom: 1.5rem; gap: 0.75rem; align-items: flex-start;">
            <input type="checkbox" name="terms" required style="margin-top: 0.3rem;"/>
            <span>Acepto los <a href="#" style="color: var(--primary-light);">Términos de Servicio</a> y la <a href="#" style="color: var(--primary-light);">Política de Privacidad</a></span>
          </label>

          <button type="submit" class="btn btn-primary form-submit">Crear Cuenta</button>
        </form>

        <p class="form-footer">
          ¿Ya tienes cuenta?
          <a href="login.html">Inicia sesión aquí</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/register.js"></script>
  <script src="js/theme-switch.js"></script>  <script src=\"sidebar-manager.js\"></script>  <script src="js/navbar.js"></script>
  <script src="js/toast.js"></script>
</body>
</html>
