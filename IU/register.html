<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - AURA Essentials</title>
  <link rel="icon" type="image/png" href="img/dark_logo.png">
  <link rel="stylesheet" href="style/styles.css">
  <link rel="stylesheet" href="style/sidebar-styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-wrapper">
      <div class="auth-side">
        <div class="image-panel">
          <img src="img/login_image.jpg" alt="Exhibición de ropa" class="auth-image" />
        </div>
      </div>

      <div class="form-container">
        <div class="form-header">
          <div>
            <button type="button" class="btn btn-secondary back-button" onclick="window.location.href='index.html'">← Regresar</button>
            <div class="form-intro">
              <h2>Crear Cuenta</h2>
              <p>Rellena el formulario para comenzar</p>
            </div>
          </div>
          <button id="themeToggle" class="btn btn-outline theme-toggle" type="button">Modo oscuro</button>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label for="fullname">Nombre Completo</label>
            <input 
              type="text" 
              id="fullname" 
              name="fullname"
              placeholder="Juan Pérez" 
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              placeholder="tu@correo.com" 
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Teléfono</label>
            <input 
              type="tel" 
              id="phone" 
              name="phone"
              placeholder="1234567890"
              pattern="[0-9]{10}"
              title="Debe contener 10 dígitos"
              required
            />
          </div>

          <div class="form-group">
            <label for="address">Dirección</label>
            <input 
              type="text" 
              id="address" 
              name="address"
              placeholder="Av. Principal 123" 
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div style="position: relative;">
              <input 
                type="password" 
                id="password" 
                name="password"
                placeholder="••••••••" 
                autocomplete="new-password"
                required
                minlength="6"
                style="padding-right: 40px; width: 100%; box-sizing: border-box;"
              />
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-secondary);">👁</button>
            </div>
            <small style="color: var(--text-secondary); font-size: 0.85rem; display: block; margin-top: 0.3rem;">Mínimo 6 caracteres</small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirmar Contraseña</label>
            <div style="position: relative;">
              <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword"
                placeholder="••••••••" 
                autocomplete="new-password"
                required
                style="padding-right: 40px; width: 100%; box-sizing: border-box;"
              />
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-secondary);">👁</button>
            </div>
          </div>

          <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1.5rem; text-align: center;">
            Al crear una cuenta, aceptas nuestros <a href="#" style="color: var(--primary-light);">Términos de Servicio</a> y la <a href="#" style="color: var(--primary-light);">Política de Privacidad</a>.
          </p>

          <button type="submit" class="btn btn-primary form-submit">Crear Cuenta</button>
        </form>

        <p class="form-footer">
          ¿Ya tienes cuenta?
          <a href="login.html">Inicia sesión aquí</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/register.js"></script>
  <script src="js/theme-switch.js"></script>
  <script>
    function togglePasswordVisibility(id) {
      const input = document.getElementById(id);
      const btn = input.nextElementSibling;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }
  </script>
  <script src="js/sidebar-manager.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/toast.js"></script>
</body>
</html>
