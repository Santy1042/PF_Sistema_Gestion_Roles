<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Tienda de Ropa</title>
  <link rel="icon" type="image/png" href="img/APOLO_2 (1).png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-wrapper">
      <div class="auth-side">
        <div class="image-panel">
          <img src="img/ropa_exibida.jpg" alt="Exhibición de ropa" class="auth-image" />
        </div>
      </div>

      <div class="form-container">
        <div class="form-header">
          <button type="button" class="btn btn-secondary back-button" onclick="window.location.href='index.html'">← Regresar</button>
          <div class="form-intro">
            <h2>Crear Cuenta</h2>
            <p>Rellena el formulario para comenzar</p>
          </div>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label for="fullname">Nombre Completo</label>
            <input 
              type="text" 
              id="fullname" 
              name="fullname"
              placeholder="Juan Pérez" 
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              placeholder="tu@correo.com" 
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Teléfono</label>
            <input 
              type="tel" 
              id="phone" 
              name="phone"
              placeholder="+56 9 1234 5678" 
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password"
              placeholder="••••••••" 
              autocomplete="new-password"
              required
              minlength="6"
            />
            <small style="color: var(--text-secondary); font-size: 0.85rem; display: block; margin-top: 0.3rem;">Mínimo 6 caracteres</small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirmar Contraseña</label>
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword"
              placeholder="••••••••" 
              autocomplete="new-password"
              required
            />
          </div>

          <label class="checkbox-wrap" style="margin-bottom: 1.5rem; gap: 0.75rem; align-items: flex-start;">
            <input type="checkbox" name="terms" required style="margin-top: 0.3rem;"/>
            <span>Acepto los <a href="#" style="color: var(--primary-light);">Términos de Servicio</a> y la <a href="#" style="color: var(--primary-light);">Política de Privacidad</a></span>
          </label>

          <button type="submit" class="btn btn-primary form-submit">Crear Cuenta</button>
        </form>

        <p class="form-footer">
          ¿Ya tienes cuenta?
          <a href="login.html">Inicia sesión aquí</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const terms = document.getElementById('registerForm').elements['terms'].checked;

      if (!fullname || !email || !password || !confirmPassword) {
        alert('Por favor rellena todos los campos');
        return;
      }

      if (password !== confirmPassword) {
        alert('Las contraseñas no coinciden');
        return;
      }

      if (password.length < 6) {
        alert('La contraseña debe tener al menos 6 caracteres');
        return;
      }

      if (!terms) {
        alert('Debes aceptar los términos de servicio');
        return;
      }

      const nameParts = fullname.split(' ');
      const firstName = nameParts[0];
      const lastName = nameParts.slice(1).join(' ') || nameParts[0];

      try {
        const response = await fetch('http://localhost:8080/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            firstName: firstName,
            lastName: lastName,
            email: email,
            password: password
          })
        });

        if (!response.ok) {
          const error = await response.json();
          alert('Error en el registro: ' + (error.message || 'Por favor intenta de nuevo'));
          return;
        }

        const data = await response.json();
        console.log('Registro exitoso:', data);
        window.location.href = 'index.html';
      } catch (error) {
        console.error('Error:', error);
        alert('Error en el registro. Por favor intenta de nuevo.');
      }
    });

    document.getElementById('confirmPassword').addEventListener('blur', function() {
      if (this.value && this.value !== document.getElementById('password').value) {
        this.style.borderColor = 'var(--error)';
      } else {
        this.style.borderColor = '';
      }
    });

    document.querySelectorAll('.btn.btn-secondary').forEach(btn => {
      if (btn.textContent.trim() === 'Google') {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          alert('Redirigiendo a Google para registro...\n\nEsta funcionalidad se conectará con tu backend para autenticación segura con Google.');
        });
      }
    });
  </script>
</body>
</html>
