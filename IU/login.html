<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Tienda de Ropa</title>
  <link rel="icon" type="image/png" href="img/APOLO_2 (1).png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-wrapper">
      <div class="auth-side">
        <div class="image-panel">
          <img src="img/ropa_exibida.jpg" alt="Exhibición de ropa" class="auth-image" />
        </div>
      </div>

      <div class="form-container">
        <div class="form-header">
          <button type="button" class="btn btn-secondary back-button" onclick="window.location.href='index.html'">← Regresar</button>
          <div class="form-intro">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa tus credenciales para continuar</p>
          </div>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              placeholder="tu@domain.com" 
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password"
              placeholder="••••••••" 
              autocomplete="current-password"
              required
            />
          </div>

          <div class="form-options">
            <label class="checkbox-wrap">
              <input type="checkbox" name="remember"/>
              <span>Recordarme</span>
            </label>
            <a href="#" class="link">¿Olvidaste tu contraseña?</a>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary form-submit">Entrar</button>
          </div>
        </form>

        <p class="form-footer">
          ¿No tienes cuenta?
          <a href="register.html">Crear una cuenta</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (email && password) {
        alert(`Iniciando sesión con: ${email}\n\nPronto se conectará con el backend.`);
      }
    });

    document.querySelectorAll('.btn.btn-secondary').forEach(btn => {
      if (btn.textContent.trim() === 'Google') {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          alert('Redirigiendo a Google...\n\nEsta funcionalidad se conectará con tu backend para autenticación segura con Google.');
        });
      }
    });
  </script>
</body>
</html>
