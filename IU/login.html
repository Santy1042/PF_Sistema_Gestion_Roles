<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Tienda de Ropa</title>
  <link rel="icon" type="image/png" href="img/APOLO_2 (1).png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-wrapper">
      <!-- Panel izquierdo decorativo -->
      <div class="auth-side">
        <div>
          <h2>Bienvenido de Vuelta</h2>
          <p>Accede a tu cuenta para continuar donde lo dejaste. Gestiona tus pedidos, guarda tus productos favoritos y disfruta de ofertas exclusivas.</p>
        </div>
      </div>

      <!-- Panel derecho — formulario -->
      <div class="form-container">
        <div class="form-header">
          <span class="form-tag">Acceso</span>
          <h2>Iniciar Sesión</h2>
          <p>Ingresa tus credenciales para continuar</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              placeholder="tu@domain.com" 
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password"
              placeholder="••••••••" 
              autocomplete="current-password"
              required
            />
          </div>

          <div class="form-options">
            <label class="checkbox-wrap">
              <input type="checkbox" name="remember"/>
              <span>Recordarme</span>
            </label>
            <a href="#" class="link">¿Olvidaste tu contraseña?</a>
          </div>

         <a href="index.html"> <button type="submit" class="btn btn-primary form-submit">Entrar</button></a>
        </form>

        <p class="form-footer">
          ¿No tienes cuenta?
          <a href="register.html">Crear una cuenta</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Validación del formulario (conectar con backend después)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (email && password) {
        alert(`Iniciando sesión con: ${email}\n\nPronto se conectará con el backend.`);
        // Aquí irá la conexión al backend
      }
    });

    // Funcionalidad de Google Login
    document.querySelectorAll('.btn.btn-secondary').forEach(btn => {
      if (btn.textContent.trim() === 'Google') {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          // Iniciar el flujo de Google OAuth
          // En producción, aquí irá: window.location.href = 'tu_backend_url/auth/google'
          alert('Redirigiendo a Google...\n\nEsta funcionalidad se conectará con tu backend para autenticación segura con Google.');
          // Placeholder para la redirección real
          // window.location.href = 'http://localhost:8080/api/auth/google';
        });
      }
    });
  </script>
</body>
</html>
