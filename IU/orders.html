<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - Sistema Gestión</title>
    <link rel="stylesheet" href="style/styles.css">
    <link rel="stylesheet" href="style/sidebar-styles.css">
    <style>
        .orders-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .order-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .order-id {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .order-date {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        
        .order-status {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 500;
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        .status-PENDING { background-color: #fef3c7; color: #92400e; }
        .status-PAID { background-color: #d1fae5; color: #065f46; }
        .status-CANCELLED { background-color: #fee2e2; color: #991b1b; }
        .status-REFUNDED { background-color: #e0e7ff; color: #3730a3; }

        .order-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-total {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
        }

        .order-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .order-report {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--surface-muted);
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .no-orders {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            background: var(--surface);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: var(--surface);
            margin: 10% auto;
            padding: 2rem;
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .modal-content textarea {
            width: 100%;
            height: 100px;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--background);
            color: var(--text-primary);
            margin-bottom: 1rem;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="orders-container">
        <h1 style="margin-bottom: 2rem;">Mis Pedidos</h1>
        
        <div id="ordersList">
            <div style="text-align: center; padding: 2rem;">Cargando pedidos...</div>
        </div>
    </main>

    <!-- Report Modal -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <h3 id="reportModalTitle">Acción de Pedido</h3>
            <p style="margin-bottom: 1rem; color: var(--text-secondary);" id="reportModalDesc">Por favor ingresa un reporte de estado para esta acción:</p>
            <textarea id="statusReportText" placeholder="Ej: Pago verificado exitosamente..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeReportModal()">Cancelar</button>
                <button class="btn btn-primary" id="confirmActionBtn">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Invoice Modal -->
    <div id="invoiceModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <h3>🧾 Factura de Pago</h3>
            <div id="invoiceContent" style="margin-bottom: 1rem; color: var(--text-primary); font-size: 0.95rem; line-height: 1.5;">
                <!-- Content injected via JS -->
            </div>
            <div class="modal-actions" style="margin-top: 2rem;">
                <button class="btn btn-primary" onclick="printInvoice()">Imprimir Factura</button>
                <button class="btn btn-outline" onclick="closeInvoiceModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth-check.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/sidebar-manager.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
